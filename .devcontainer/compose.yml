services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    volumes:
      - type: bind
        source: ../..
        target: /workspaces/
    secrets:
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
    command: sleep infinity
    networks:
      - default

  database:
    image: postgres:18
    volumes:
      - type: volume
        source: postgres-vol
        target: /var/lib/postgresql
      - type: bind
        source: ./initsql
        target: /docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - default

secrets:
  GOOGLE_CLIENT_ID:
    file: C:/Users/ho-nhat-phi/workspaceSecret/GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET:
    file: C:/Users/ho-nhat-phi/workspaceSecret/GOOGLE_CLIENT_SECRET

volumes:
  postgres-vol:
